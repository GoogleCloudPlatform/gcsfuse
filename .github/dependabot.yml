version: 2
enable-beta-ecosystems: true
updates:
- package-ecosystem: docker # zizmor: ignore[dependabot-cooldown]
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: gomod # zizmor: ignore[dependabot-cooldown]
  directory: "/"
  allow:
  - dependency-type: "direct"
  ignore:
    # Keep google.golang.org/grpc aligned with cloud.google.com/go/storage (b/392912617)
    - dependency-name: "google.golang.org/grpc"
      update-types: ["version-update:semver-minor", "version-update:semver-patch"]
  schedule:
    interval: weekly
  groups:
    # Group all Go updates together in a single PR.
    go-dependencies:
      patterns:
        - "*"
- package-ecosystem: pip # zizmor: ignore[dependabot-cooldown]
  directory: "/"
  schedule:
    interval: weekly
  groups:
    python-dependencies:
      patterns:
        - "*"

name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
permissions:
  contents: read

# Ensure only the latest run per branch is active (cancel older in-progress runs),
# but allow every master commit to run (don't cancel or group master runs together).
concurrency:
  # For master we use a unique group per run (github.run_id) so runs don't cancel each other.
  # For other refs we use the ref as the group so a new run cancels any previous in-progress run on that ref.
  group: ${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  # Cancel in-progress runs for non-master refs; do not cancel on master.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            run_tests:
              - '!**/*.md'
              - '!tools/**'
              - '!perfmetrics/**'
              - '!samples/**'
  format-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@latest
    - name: CodeGen
      run: go generate ./...
    - name: Formatting and Imports check
      run: |
        goimports -w .
        gofmt -s -w .
        go mod tidy
        git diff --exit-code --name-only
    - name: Check grpc-go version alignment with cloud.google.com/go/storage
      run: |
        ALLOWED_GRPC_OVERRIDE_VERSION="" # Set only for documented out-of-band grpc-go CVE exceptions
        STORAGE_MOD=$(GOWORK=off go list -mod=readonly -m -f '{{.Path}}@{{.Version}}' cloud.google.com/go/storage)
        GCSFUSE_GRPC=$(GOWORK=off go list -mod=readonly -m -f '{{.Version}}' google.golang.org/grpc)
        SDK_GRPC=$(GOWORK=off go mod graph | awk -v sm="$STORAGE_MOD" '$1 == sm && $2 ~ /^google\.golang\.org\/grpc@/ {sub(/^google\.golang\.org\/grpc@/, "", $2); print $2}')
        OTHER_REQUIRES_CURRENT=$(GOWORK=off go mod graph | awk -v target="google.golang.org/grpc@${GCSFUSE_GRPC}" -v sm="$STORAGE_MOD" '$1 !~ /^github\.com\/googlecloudplatform\/gcsfuse/ && $1 != sm && $2 == target { print $1 }' | paste -sd ", " -)

        if [ -z "$SDK_GRPC" ]; then
          echo "::error::Could not determine google.golang.org/grpc version required by $STORAGE_MOD"
          exit 1
        fi

        echo "GCSFuse grpc-go: ${GCSFUSE_GRPC} | ${STORAGE_MOD} grpc-go: ${SDK_GRPC}"
        if [ "$GCSFUSE_GRPC" != "$SDK_GRPC" ]; then
          if [ -n "$ALLOWED_GRPC_OVERRIDE_VERSION" ] && [ "$GCSFUSE_GRPC" = "$ALLOWED_GRPC_OVERRIDE_VERSION" ]; then
            echo "::warning::google.golang.org/grpc ($GCSFUSE_GRPC) differs from $STORAGE_MOD ($SDK_GRPC), allowed via ALLOWED_GRPC_OVERRIDE_VERSION."
            exit 0
          elif [ -n "$OTHER_REQUIRES_CURRENT" ]; then
            echo "::warning::google.golang.org/grpc ($GCSFUSE_GRPC) differs from $STORAGE_MOD ($SDK_GRPC) due to transitive MVS requirement from: ${OTHER_REQUIRES_CURRENT}."
            exit 0
          fi
          echo "::error::google.golang.org/grpc ($GCSFUSE_GRPC) does not match $STORAGE_MOD ($SDK_GRPC)."
          echo "To align with $STORAGE_MOD, run: go mod edit -require=google.golang.org/grpc@$SDK_GRPC && go mod tidy"
          exit 1
        fi

  linux-tests:
    needs: filter
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: Install fuse
      run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse-dev
    - name: Build
      if: ${{ needs.filter.outputs.run_tests == 'true' }}
      run: |
        CGO_ENABLED=0 go build ./...
        go install ./tools/build_gcsfuse
        build_gcsfuse . /tmp ${GITHUB_SHA}
    - name: Test all
      if: ${{ needs.filter.outputs.run_tests == 'true' }}
      run: CGO_ENABLED=0 go test -p 1 -count 1 -covermode=atomic -coverprofile=coverage.out -coverpkg=./... -v -skip `cat flaky_tests.lst | go run tools/scripts/skip_tests/main.go` `go list ./... | grep -v 'tools/integration_tests'`
    - name: RaceDetector Test
      if: ${{ needs.filter.outputs.run_tests == 'true' }}
      run: go test -p 1 -count 1 -v -race -skip `cat flaky_tests.lst | go run tools/scripts/skip_tests/main.go` ./internal/cache/... ./internal/gcsx/...
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@5ecb98a3c6b747ed38dc09f787459979aebb39be # v4.3.1
      timeout-minutes: 5
      with:
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests

  lint:
    name: Lint
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        args: -E=unused --timeout 3m0s
        only-new-issues: true

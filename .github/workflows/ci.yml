name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
permissions:
  contents: read

# Ensure only the latest run per branch is active (cancel older in-progress runs),
# but allow every master commit to run (don't cancel or group master runs together).
concurrency:
  # For master we use a unique group per run (github.run_id) so runs don't cancel each other.
  # For other refs we use the ref as the group so a new run cancels any previous in-progress run on that ref.
  group: ${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  # Cancel in-progress runs for non-master refs; do not cancel on master.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            run_tests:
              - '!**/*.md'
              - '!tools/**'
              - '!perfmetrics/**'
              - '!samples/**'
  format-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@latest
    - name: CodeGen
      run: go generate ./...
    - name: Formatting and Imports check
      run: |
        goimports -w .
        gofmt -s -w .
        go mod tidy
        git diff --exit-code --name-only

  build:
    name: Build
    needs: filter
    if: ${{ needs.filter.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: Build
      run: |
        CGO_ENABLED=0 go build ./...
        go install ./tools/build_gcsfuse
        build_gcsfuse . /tmp ${GITHUB_SHA}

  linux-tests-matrix:
    name: Linux tests (${{ matrix.suite }})
    needs: filter
    if: ${{ needs.filter.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            test-cmd: CGO_ENABLED=0 go test -p 1 -count 1 -covermode=atomic -coverprofile=coverage.out -coverpkg=./... -v -skip `cat flaky_tests.lst | go run tools/scripts/skip_tests/main.go` `go list ./... | grep -v 'tools/integration_tests'`
            upload-coverage: true
          - suite: race
            test-cmd: go test -p 1 -count 1 -v -race -skip `cat flaky_tests.lst | go run tools/scripts/skip_tests/main.go` ./internal/cache/... ./internal/gcsx/...
            upload-coverage: false

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: Install fuse
      run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse-dev
    - name: Run Test (${{ matrix.suite }})
      run: ${{ matrix.test-cmd }}
    - name: Upload coverage reports to Codecov
      if: matrix.upload-coverage
      uses: codecov/codecov-action@5ecb98a3c6b747ed38dc09f787459979aebb39be # v4.3.1
      timeout-minutes: 5
      with:
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests

  linux-tests:
    name: Linux tests
    needs: [filter, build, linux-tests-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Verify build and test status
      run: |
        # 1. Ensure filter job completed successfully
        if [ "${{ needs.filter.result }}" != "success" ]; then
          echo "::error::Upstream 'filter' job did not succeed. Status: ${{ needs.filter.result }}"
          exit 1
        fi

        # 2. Allow clean pass on docs-only changes
        if [ "${{ needs.filter.outputs.run_tests }}" != "true" ]; then
          echo "Notice: Tests bypassed via path filter (doc/non-code changes)."
          exit 0
        fi

        # 3. Enforce build succeeded
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "::error::'build' job did not succeed. Status: ${{ needs.build.result }}"
          exit 1
        fi

        # 4. Enforce test matrix succeeded
        if [ "${{ needs.linux-tests-matrix.result }}" != "success" ]; then
          echo "::error::'linux-tests-matrix' did not succeed. Status: ${{ needs.linux-tests-matrix.result }}"
          exit 1
        fi

        echo "SUCCESS: All required build and test checks passed."

  flake-detector:
    name: Flake detector (${{ matrix.suite }})
    needs: filter
    if: (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && needs.filter.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            test-cmd: CGO_ENABLED=0 go test -p 1 -count 5 -skip `cat flaky_tests.lst | go run tools/scripts/skip_tests/main.go` `go list ./... | grep -v 'tools/integration_tests'`
          - suite: race
            test-cmd: go test -p 1 -count 5 -v -race -skip `cat flaky_tests.lst | go run tools/scripts/skip_tests/main.go` ./internal/cache/... ./internal/gcsx/...

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: Install fuse
      run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse-dev
    - name: Deflake Test (${{ matrix.suite }})
      run: ${{ matrix.test-cmd }}

  lint:
    name: Lint
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Setup Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: '.go-version'
    - name: golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
      with:
        args: -E=unused --timeout 3m0s
        only-new-issues: true

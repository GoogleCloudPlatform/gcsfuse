name: PR Review Reminder

on:
  # Allow manual runs.
  workflow_dispatch:
  schedule:
    # Runs every hour from 9AM to 5PM IST weekdays.
    - cron: '30 3-11 * * 1-5'

jobs:
  remind:
    runs-on: ubuntu-latest
    # These permissions are required for the action to post comments on pull requests.
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Install Dependencies
        # Pin to latest version supporting commonJS syntax used in reminder.js
        run: npm install @actions/github@5.1.1 @actions/core 

      - name: Run Reminder Script
        run: node .github/scripts/reminder.js
        env:
          # The GITHUB_TOKEN is automatically created by Actions.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

apiVersion: v1
kind: PersistentVolume
metadata:
  name: serving-bucket-pv
spec:
  accessModes:
  - ReadWriteMany
  capacity:
    storage: 64Gi
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcsfuse-sc # dummy storage class
  claimRef:
    namespace: <customer-namespace>
    name: serving-bucket-pvc
  mountOptions:
  - implicit-dirs                       # Create implicit directories locally when accessed
  - metadata-cache:negative-ttl-secs:0  # Disable caching for lookups of files/dirs that don't exist
  - metadata-cache:ttl-secs:-1          # Keep cached metadata (file attributes, types) indefinitely time-wise
  - metadata-cache:stat-cache-max-size-mb:-1 # Allow unlimited size for the file attribute (stat) cache
  - file-system:kernel-list-cache-ttl-secs:-1 # Cache directory listings in kernel page cache indefinitely
  - read:enable-buffered-read:true      # Enable buffered read to prefetch data from GCS
  - read:global-max-blocks:80           # Maximum number of blocks available for buffered reads across all file handles
  - read_ahead_kb=131072                # Increase kernel read-ahead buffer
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: <serving-bucket>      # Name of the GCS Bucket to mount
    volumeAttributes:
      skipCSIBucketAccessCheck: "true"  # Bypass the CSI Drivers bucket access check
      gcsfuseMetadataPrefetchOnMount: "true" # Fetch GCS metadata immediately at mount time
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serving-bucket-pvc
  namespace: <customer-namespace>
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 64Gi
  volumeName: serving-bucket-pv
  storageClassName: gcsfuse-sc # dummy storage class
